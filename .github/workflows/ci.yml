name: CUBAFOOD CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: cubafood-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build first so functional/build failures are visible even if existing style-only lint findings remain.
      # The TanStack file-route plugin regenerates routeTree.gen.ts during build.
      # Build before TypeScript validation whenever routes are added or removed.
      - name: Production build
        run: bun run build

      - name: Verify exact-release health contract (offline)
        run: node --test scripts/verify-release-health.test.mjs

      - name: Verify public read-only smoke rules (offline)
        run: node --test scripts/smoke-public-site.test.mjs

      - name: Verify language preferences under blocked storage
        run: bun test scripts/i18n-preferences.test.mjs

      - name: TypeScript check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Verify manual cPanel recovery without production access
        shell: bash
        run: |
          bash -n deploy/mochahost/manual-activate.sh
          bash -n deploy/mochahost/manual-rollback.sh
          bash -n scripts/test-manual-release.sh
          bash scripts/test-manual-release.sh
